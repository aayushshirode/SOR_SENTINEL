<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sentinel-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SOR SENTINEL — AI-powered source credibility and sensitivity checker for students, researchers, journalists, and organizations." />
    <title>SOR SENTINEL — AI Source Credibility Checker</title>
    <!-- Five Enterprise Cybersecurity Fonts: Space Grotesk, Sora, Outfit, IBM Plex Sans, Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sor_theme') || 'default';
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
