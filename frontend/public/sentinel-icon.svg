    </linearGradient>
    <linearGradient id="sl_lock_fill" x1="50" y1="42" x2="50" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="#08101d"/>
  <circle cx="50" cy="50" r="46" fill="url(#sl_aura)"/>
  <circle cx="50" cy="50" r="44" stroke="#00d4ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 3"/>

