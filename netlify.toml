# Netlify Configuration for SOR SENTINEL
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"

[context.production]
  command = "npm run build"

# Redirect /login to canonical /signin
[[redirects]]
  from = "/login"
  to = "/signin"
  status = 301
  force = true

# Proxy API calls directly through Netlify's edge to the FastAPI backend
[[redirects]]
  from = "/api/*"
  to = "https://refine-annotation-microphone-delaware.trycloudflare.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback (prevents 404 on direct URL access/page reload/refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
