# Netlify Configuration for SOR SENTINEL
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls directly through Netlify's edge to the FastAPI backend
[[redirects]]
  from = "/api/*"
  to = "https://occupational-standing-recovered-technician.trycloudflare.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
